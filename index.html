<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Spooky Season — Halloween zine">
<meta property="og:image" content="p-01.jpg">
<title>Spooky Season</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Marck+Script&display=swap">
<style>
/* Layout: a dim reading room — the zine's own hairline masthead on top, the open book centered, page controls underneath */
:root {
  --bg: #1c1924;
  --glow: #3b3050;
  --cream: #f1e6d2;
  --muted: #a69dba;
  --neon: #ff4fa3;
  --line: rgba(241, 230, 210, .2);
  --display: "Rye", "Old Standard TT", Georgia, serif;
  --serif: "Old Standard TT", Georgia, "Times New Roman", serif;
  --hand: "Marck Script", "Segoe Script", cursive;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse 70% 60% at 50% 45%, var(--glow), var(--bg) 70%) var(--bg);
  color: var(--cream);
  font-family: var(--serif);
}

/* masthead — echoes the cover's top rule */
.mast {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: end;
  gap: 12px;
  padding-block: 14px 10px;
  border-bottom: 1px solid var(--line);
  max-width: 1100px;
  width: 100%;
  margin-inline: auto;
}
.mast .tag {
  font-size: 11px;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: var(--muted);
}
.mast .tag:last-child { text-align: right; }
.mast h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(20px, 3vw, 28px);
  line-height: 1;
  letter-spacing: .04em;
  color: var(--cream);
  text-shadow: 2px 2px 0 #b5442c;
}
.mast h1 em {
  font-family: var(--hand);
  font-style: normal;
  color: var(--neon);
  text-shadow: 0 0 10px rgba(255, 79, 163, .6);
  margin-left: .25em;
  letter-spacing: 0;
}

/* stage */
#stage {
  flex: 1;
  min-height: 0;
  display: grid;
  place-items: center;
  padding-block: 16px 8px;
  overflow: hidden;
  position: relative;
  z-index: 1;
}
#book {
  transition: transform .6s cubic-bezier(.3, .7, .2, 1);
  filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .55));
}
.page { background: var(--bg); }
.page img {
  display: block;
  width: 100%;
  height: 100%;
  max-width: 100%;
  object-fit: cover;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
}

/* controls */
.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding-block: 6px 4px;
  position: relative;
  z-index: 20;
}
.btn {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--cream);
  font: 20px/1 var(--serif);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: border-color .2s, box-shadow .2s, color .2s, opacity .2s;
}
.btn:hover:not(:disabled), .btn:focus-visible {
  border-color: var(--neon);
  color: var(--neon);
  box-shadow: 0 0 14px rgba(255, 79, 163, .45);
  outline: none;
}
.btn:disabled { opacity: .3; cursor: default; }
.btn[hidden] { display: none; }
.btn.small { width: 36px; height: 36px; font-size: 15px; }
#counter {
  min-width: 92px;
  text-align: center;
  font-size: 13px;
  letter-spacing: .28em;
  font-variant-numeric: tabular-nums;
  color: var(--cream);
}
.hint {
  text-align: center;
  font-family: var(--hand);
  font-size: 17px;
  color: var(--muted);
  padding-block: 0 12px;
  margin: 0;
  position: relative;
  z-index: 20;
}
.hint b { color: var(--neon); font-weight: 400; }

@media (max-width: 560px) {
  .mast { grid-template-columns: 1fr; justify-items: center; }
  .mast .tag { display: none; }
  .hint { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) {
  #book { transition: none; }
}
/* Phones: a filter on the whole book is re-rasterized on every page turn and
   makes mobile webviews (Telegram's in-app browser) stutter or drop pages. */
@media (max-width: 900px), (pointer: coarse) {
  #book { filter: none; }
  .page { background: #2a2433; }
}
/* Phones: plain swipe strip instead of the 3D page-flip. iOS Safari/WebKit drops
   images inside the flip's 3D layers, so pages flash for a moment and go blank. */
#book.swipe {
  display: flex;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  border-radius: 4px;
  transition: none;
}
#book.swipe::-webkit-scrollbar { display: none; }
#book.swipe .page {
  flex: 0 0 100%;
  height: 100%;
  position: relative;
  scroll-snap-align: center;
  scroll-snap-stop: always;
}

/* clickable spots carried over from the PDF */
.inner { position: absolute; inset: 0; }
.hot {
  position: absolute;
  display: block;
  border-radius: 8px;
  cursor: pointer;
  outline: 2px solid transparent;
  outline-offset: 2px;
  transition: outline-color .2s, box-shadow .2s, background-color .2s;
}
.hot:hover, .hot:focus-visible {
  outline-color: var(--neon);
  background-color: rgba(255, 79, 163, .08);
  box-shadow: 0 0 18px rgba(255, 79, 163, .55);
}
.ping {
  position: absolute;
  width: 1.9em;
  height: 1.9em;
  font-size: clamp(9px, 1.15vw, 14px);
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--neon);
  color: #fff;
  font-family: var(--serif);
  font-weight: 700;
  line-height: 1;
  box-shadow: 0 0 10px rgba(255, 79, 163, .8), 0 2px 6px rgba(0, 0, 0, .35);
  pointer-events: none;
  transform: translate(-50%, -50%);
}
.ping::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--neon);
  animation: ping 1.8s ease-out infinite;
}
@keyframes ping {
  from { transform: scale(1); opacity: .9; }
  to { transform: scale(2.1); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .ping::after { animation: none; }
}
</style>
</head>
<body>

<header class="mast">
  <span class="tag">Vol. 01</span>
  <h1>Spooky<em>Season</em></h1>
  <span class="tag">Halloween 2026</span>
</header>

<main id="stage">
  <div id="book" aria-label="Зин Spooky Season, 18 страниц"></div>
</main>

<nav class="controls" aria-label="Листать страницы">
  <button class="btn" id="prev" type="button" aria-label="Предыдущая страница">←</button>
  <span id="counter" aria-live="polite">1 / 18</span>
  <button class="btn" id="next" type="button" aria-label="Следующая страница">→</button>
  <button class="btn small" id="fs" type="button" aria-label="Во весь экран" title="Во весь экран">⤢</button>
</nav>
<p class="hint">тяни за уголок или листай стрелками <b>✦</b></p>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function () {
  var N = 18;
  // link areas copied from the PDF (points, origin bottom-left); ping = badge spot in % of the area
  var PW = 810, PH = 1013.04;
  var LINKS = {
    18: [
      { r: [34.5, 289.3, 396.0, 551.8], url: 'https://t.me/gossipb_bot', label: 'Записаться в Speaking club через @gossipb_bot', ping: [93, 14] },
      { r: [416.2, 284.8, 776.2, 544.3], url: 'https://t.me/gossipb_bot', label: 'Записаться в Deep dive через @gossipb_bot', ping: [45, 93] },
      { r: [38.2, 173.0, 771.8, 290.8], url: 'https://t.me/gossipb_bot', label: 'Открыть Telegram-бот @gossipb_bot', ping: [83, 22] },
      { r: [30.0, 0.5, 290.2, 104.0], url: 'https://t.me/tuessss', label: 'Telegram-канал @tuessss', ping: [88, 30] },
      { r: [290.2, 0.5, 551.2, 104.0], url: 'https://www.instagram.com/gossipbakeryclub/', label: '@gossipbakeryclub', ping: [88, 30] },
      { r: [549.0, 0.5, 795.0, 118.3], url: 'https://www.tiktok.com/@gossipbakery', label: 'TikTok @gossipbakery', ping: [90, 22] }
    ]
  };
  var RATIO = 810 / 1013;           // page width / height
  var MIN_PAGE = 260;               // narrower than this → one page at a time
  var stage = document.getElementById('stage');
  var book = document.getElementById('book');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var counter = document.getElementById('counter');
  var fs = document.getElementById('fs');

  // Phones (incl. Telegram's in-app browser) get lighter page files, and pages
  // load only around the open spread: 18 full-size images at once exhaust the
  // mobile webview's memory and pages stay blank.
  var SMALL = window.matchMedia && matchMedia('(max-width: 900px), (pointer: coarse)').matches;
  function pageSrc(n) {
    return 'p-' + String(n).padStart(2, '0') + (SMALL ? '-m' : '') + '.jpg';
  }
  var imgs = [];
  function loadAround(idx) {
    for (var k = idx - 2; k <= idx + 5; k++) {
      var im = imgs[k];
      if (im && !im.getAttribute('src')) im.src = im.getAttribute('data-src');
    }
  }

  for (var i = 1; i <= N; i++) {
    var p = document.createElement('div');
    p.className = 'page';
    if (i === 1 || i === N) p.setAttribute('data-density', 'hard');
    var inner = document.createElement('div');
    inner.className = 'inner';
    var img = document.createElement('img');
    img.setAttribute('data-src', pageSrc(i));
    img.alt = 'Страница ' + i;
    img.decoding = 'async';
    imgs.push(img);
    inner.appendChild(img);
    (LINKS[i] || []).forEach(function (l) {
      var a = document.createElement('a');
      a.className = 'hot';
      a.href = l.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.title = l.label;
      a.setAttribute('aria-label', l.label);
      a.style.left = (l.r[0] / PW * 100) + '%';
      a.style.top = ((PH - l.r[3]) / PH * 100) + '%';
      a.style.width = ((l.r[2] - l.r[0]) / PW * 100) + '%';
      a.style.height = ((l.r[3] - l.r[1]) / PH * 100) + '%';
      if (l.ping) {
        var dot = document.createElement('span');
        dot.className = 'ping';
        dot.textContent = '↗';
        dot.style.left = l.ping[0] + '%';
        dot.style.top = l.ping[1] + '%';
        a.appendChild(dot);
      }
      inner.appendChild(a);
    });
    p.appendChild(inner);
    book.appendChild(p);
  }

  function setupSwipe() {
    book.classList.add('swipe');
    fs.hidden = true;
    var hint = document.querySelector('.hint');
    if (hint) hint.innerHTML = 'листай свайпом или стрелками <b>✦</b>';
    var idx = 0;
    function fit() {
      var r = stage.getBoundingClientRect();
      var cs = getComputedStyle(stage);
      var ah = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      var w = Math.floor(Math.min(r.width, ah * RATIO));
      book.style.width = w + 'px';
      book.style.height = Math.floor(w / RATIO) + 'px';
      book.scrollLeft = idx * w;
    }
    function show(i) {
      idx = Math.max(0, Math.min(N - 1, i));
      counter.textContent = (idx + 1) + ' / ' + N;
      prev.disabled = idx <= 0;
      next.disabled = idx >= N - 1;
      loadAround(idx);
    }
    function go(i) {
      i = Math.max(0, Math.min(N - 1, i));
      book.scrollTo({ left: i * book.clientWidth, behavior: 'smooth' });
      show(i);
    }
    book.addEventListener('scroll', function () {
      var i = Math.round(book.scrollLeft / Math.max(1, book.clientWidth));
      if (i !== idx) show(i);
    }, { passive: true });
    prev.addEventListener('click', function () { go(idx - 1); });
    next.addEventListener('click', function () { go(idx + 1); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') go(idx + 1);
      if (e.key === 'ArrowLeft') go(idx - 1);
    });
    var t;
    window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fit, 120); });
    fit();
    show(0);
  }

  function size() {
    var r = stage.getBoundingClientRect();
    var cs = getComputedStyle(stage);
    var aw = r.width;
    var ah = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var spread = Math.min(aw, ah * RATIO * 2);
    var w, h;
    if (spread / 2 >= MIN_PAGE) { w = spread; h = spread / 2 / RATIO; }
    else { w = Math.min(aw, ah * RATIO); h = w / RATIO; }
    book.style.width = Math.floor(w) + 'px';
    book.style.height = Math.floor(h) + 'px';
  }
  size();
  loadAround(0);

  if (SMALL) { setupSwipe(); return; }

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var pf = new St.PageFlip(book, {
    width: 405, height: 507,
    size: 'stretch',
    minWidth: MIN_PAGE, maxWidth: 1400,
    minHeight: 200, maxHeight: 1800,
    showCover: true,
    usePortrait: true,
    drawShadow: !SMALL,
    maxShadowOpacity: .45,
    flippingTime: reduce ? 250 : (SMALL ? 600 : 850),
    mobileScrollSupport: false
  });
  pf.loadFromHTML(document.querySelectorAll('#book .page'));

  function refresh() {
    var idx = pf.getCurrentPageIndex();
    loadAround(idx);
    var land = pf.getOrientation() === 'landscape';
    var label;
    if (land && idx > 0 && idx < N - 1) {
      var left = idx % 2 === 1 ? idx : idx - 1;
      label = (left + 1) + '–' + (left + 2) + ' / ' + N;
    } else {
      label = (idx + 1) + ' / ' + N;
    }
    counter.textContent = label;
    prev.disabled = idx <= 0;
    next.disabled = idx >= N - 1;
    // keep whatever is open centered: a lone cover, a lone back page or a spread
    var shift = 0;
    try {
      var b = pf.getBoundsRect ? pf.getBoundsRect() : pf.getRender().getRect();
      var pw = b.pageWidth || b.width / (land ? 2 : 1);
      var center = b.left + (land ? pw : pw / 2);
      if (land && idx === 0) center = b.left + pw * 1.5;
      if (land && idx >= N - 1 && N % 2 === 0) center = b.left + pw * 0.5;
      shift = book.clientWidth / 2 - center;
    } catch (err) { shift = 0; }
    book.style.transform = 'translateX(' + Math.round(shift) + 'px)';
  }

  pf.on('flip', refresh);
  pf.on('changeOrientation', refresh);
  pf.on('init', refresh);
  // dragging a corner reveals the next page before 'flip' fires
  pf.on('changeState', function () { loadAround(pf.getCurrentPageIndex()); });
  refresh();

  prev.addEventListener('click', function () { pf.flipPrev(); });
  next.addEventListener('click', function () { pf.flipNext(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') pf.flipNext();
    if (e.key === 'ArrowLeft') pf.flipPrev();
  });

  var t;
  function relayout() {
    clearTimeout(t);
    t = setTimeout(function () { size(); pf.update(); refresh(); }, 120);
  }
  window.addEventListener('resize', relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(stage);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

  var root = document.documentElement;
  if (!root.requestFullscreen) { fs.hidden = true; }
  fs.addEventListener('click', function () {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else root.requestFullscreen().catch(function () { fs.hidden = true; });
    } catch (err) { fs.hidden = true; }
  });
  document.addEventListener('fullscreenchange', function () {
    fs.textContent = document.fullscreenElement ? '⤡' : '⤢';
  });
})();
</script>

</body>
</html>
